<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidBuilder AI</title>
    <style>
        /* --- CSS Reset & Base Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Main Container Card --- */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e1e4e8;
        }

        /* --- Header Styling --- */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #1a202c;
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            color: #718096;
            font-size: 16px;
        }

        /* --- Form Elements --- */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px; /* Prevents zoom on mobile */
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }

        /* Input Focus State */
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }

        textarea {
            resize: vertical; /* Allow vertical resizing only */
        }

        /* --- Date Row Specifics (Side-by-Side) --- */
        .date-row {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .date-col {
            flex: 1; /* Both columns take equal width */
            display: flex;
            flex-direction: column;
        }

        input[type="date"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        /* --- Submit Button --- */
        button[type="submit"] {
            width: 100%;
            background-color: #2b6cb0;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #2c5282;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BidBuilder AI</h1>
            <p>Enterprise RFP Response Architect</p>
        </header>

        <form action="/generate" method="POST">
            <div class="form-group">
                <label for="client_name">Client Name</label>
                <input type="text" id="client_name" placeholder="e.g. Apollo Healthcare" required>
            </div>

            <div class="form-group">
                <label for="client_industry">Industry</label>
                <select id="client_industry" required>
                    <option value="" disabled selected>Select Industry</option>
                    <option value="Fintech">Fintech</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="E-commerce">E-Commerce</option>
                    <option value="Government">Government</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="project_goal">Project Goal</label>
                <textarea id="project_goal" rows="4" placeholder="Describe the core objective" required></textarea>
            </div>

            <div class="form-group">
                <label for="target_audience">Target Audience</label>
                <select id="target_audience" required>
                    <option value="" disabled selected>Select Target Audience</option>
                    <option value="Internal Staff">Internal Staff</option>
                    <option value="B2B Customers">B2B Customers</option>
                    <option value="General Public">General Public</option>
                </select>
            </div>

            <div class="date-row">
                <div class="date-col">
                    <label for="start_date">Start Date</label>
                    <input type="date" id="start_date" required>
                </div>
                <div class="date-col">
                    <label for="end_date">End Date</label>
                    <input type="date" id="end_date" required>
                </div>
            </div>

            <div class="form-group">
                <label for="budget_range">Budget Range (in $)</label>
                <select id="budget_range" required>
                    <option value="" disabled selected>Select Budget Range</option>
                    <option value="Under $50k">Under $50k</option>
                    <option value="$50k - $100k">$50k - $100k</option>
                    <option value="$100k - $500k">$100k - $500k</option>
                    <option value="$1M+">$1M+</option>
                    <option value="TBD">TBD</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tech_pref">Tech Stack Preference</label>
                <input type="text" id="tech_pref" placeholder="e.g. React, Python, AWS" required>
            </div>

            <div class="form-group">
                <label for="tone">Proposal Tone</label>
                <select id="tone" required>
                    <option value="" disabled selected>Select Proposal Tone</option>
                    <option value="Formal & Corporate">Formal & Corporate</option>
                    <option value="Innovative & Bold">Innovative & Bold</option>
                    <option value="Technical & Precise">Technical & Precise</option>
                </select>
            </div>

            <div>
                <button type="submit">Generate Proposal</button>
            </div>

        </form>
    </div>

</body>
</html>
